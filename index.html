<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Recetas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Incluimos PDF.js para leer PDFs directamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>

    <!-- Panel de Control Superior -->
    <header class="no-print control-panel">
        <h1>Generador de Recetas</h1>
        
        <div class="controls-container">
            <!-- Botón Importar PDF -->
            <div class="control-group">
                <label for="pdfUpload" class="btn-import" style="cursor: pointer; background: #27ae60; color: white; padding: 8px 12px; border-radius: 4px; display: inline-block; font-size: 14px;">
                    📂 Importar PDF
                </label>
                <input type="file" id="pdfUpload" accept=".pdf" style="display: none;">
            </div>

            <!-- Selección de Fondos -->
            <div class="control-group">
                <label for="bgSelect">Fondo:</label>
                <select id="bgSelect">
                    <option value="/recetas/fondos/fondo_1.jpeg">Fondo 1</option>
                    <option value="/recetas/fondos/fondo_2.jpeg">Fondo 2</option>
                    <option value="/recetas/fondos/fondo_3.jpeg">Fondo 3</option>
                    <option value="/recetas/fondos/fondo_4.jpeg">Fondo 4</option>
                    <option value="/recetas/fondos/fondo_5.jpeg">Fondo 5</option>
                    <option value="/recetas/fondos/fondo_6.jpeg">Fondo 6</option>
                    <option value="">Sin fondo (Blanco)</option>
                </select>
            </div>

            <!-- Herramientas de Texto -->
            <div class="control-group text-tools">
                <label>Estilo de Texto:</label>
                <div class="tools-row">
                    <button type="button" data-command="bold" title="Negrita"><b>N</b></button>
                    <button type="button" data-command="italic" title="Cursiva"><i>C</i></button>
                    <button type="button" data-command="underline" title="Subrayado"><u>S</u></button>
                    <div class="tool-divider"></div>
                    <button type="button" data-command="justifyLeft" title="Izquierda">Izquierda</button>
                    <button type="button" data-command="justifyCenter" title="Centro">Centro</button>
                    <button type="button" data-command="justifyRight" title="Derecha">Derecha</button>
                    <div class="tool-divider"></div>
                    <label for="textColor" class="sub-label">Color:</label>
                    <input type="color" id="textColor" value="#2c3e50" title="Color">
                    <label for="fontSizeSelect" class="sub-label">Tamaño:</label>
                    <select id="fontSizeSelect">
                        <option value="2">Pequeño</option>
                        <option value="3" selected>Normal</option>
                        <option value="5">Grande</option>
                        <option value="6">Muy Grande</option>
                    </select>
                </div>
            </div>

            <!-- Botón PDF -->
            <div class="control-group">
                <button id="btnPdf" class="btn-primary">Descargar / Guardar PDF</button>
            </div>
            
            <!-- Dentro del panel de control superior, junto al botón de importar PDF -->
            <div class="control-group">
                <button type="button" id="btnClearSheet" class="btn-secondary" style="background: #e74c3c; color: white; padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px;">
                    🗑️ Limpiar Pantalla
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <div class="main-layout">
        <aside class="no-print sidebar">
            <h3>Elementos</h3>
            <p class="sidebar-tip">Haz clic para agregar:</p>
            
            <div class="draggable-items">
                <div class="drag-item" data-type="title">📌 Título</div>
                <div class="drag-item" data-type="time">⏱️ Tiempo</div>
                <div class="drag-item" data-type="complexity">⭐ Complejidad</div>
                <div class="drag-item" data-type="portions">🍽️ Porciones</div>
                <div class="drag-item" data-type="ingredients">🥗 Ingredientes</div>
                <div class="drag-item" data-type="preparation">🍳 Preparación</div>
                <div class="drag-item" data-type="text">📝 Bloque de Texto</div>
            </div>
        </aside>

        <main class="page-container">
            <div id="recipeSheet" class="recipe-sheet">
                <div id="dropZone" class="recipe-content">
                    <div class="placeholder-msg">Importa tu PDF o haz clic en los elementos para armar tu receta...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
